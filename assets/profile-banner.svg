<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Alfakih — Data Engineering and Analytics Engineering</title>
  <desc id="desc">A dark blue and purple banner with Mohammed's name and a simple ingest, model, serve data pipeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#19182f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#a78bfa" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <path d="M 48 246 H 752" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="66" fill="#a78bfa" font-size="16" font-weight="600" letter-spacing="4">DATA ENGINEERING / ANALYTICS ENGINEERING</text>
    <text x="45" y="147" fill="#f0f6fc" font-size="64" font-weight="700" letter-spacing="-2">Mohammed Alfakih</text>
    <text x="48" y="201" fill="#9da7bc" font-size="23">Python. SQL. Reliable pipelines. Useful insights.</text>
  </g>
  <g transform="translate(864 74)" fill="none">
    <path d="M 32 26 H 183 V 89 H 32 V 151 H 183" stroke="#667492" stroke-width="2"/>
    <g stroke="url(#accent)" stroke-width="2">
      <rect x="-5" y="6" width="74" height="40" rx="9" fill="#171a2e"/>
      <rect x="146" y="69" width="74" height="40" rx="9" fill="#171a2e"/>
      <rect x="-5" y="131" width="74" height="40" rx="9" fill="#171a2e"/>
    </g>
    <g fill="#d9e2f1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1">
      <text x="32" y="32">INGEST</text>
      <text x="183" y="95">MODEL</text>
      <text x="32" y="157">SERVE</text>
    </g>
    <circle cx="183" cy="26" r="4" fill="#a78bfa"/>
    <circle cx="32" cy="89" r="4" fill="#38bdf8"/>
    <circle cx="183" cy="151" r="4" fill="#a78bfa"/>
  </g>
</svg>
